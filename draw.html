<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>魚を描こう</title>

<style>

body{
    background:#eef8ff;
    text-align:center;
    font-family:sans-serif;
}

h1{
    color:#0066aa;
}

canvas{
    border:2px solid #333;
    background:white;
}

button{
    font-size:18px;
    padding:10px 20px;
    margin:10px;
}

</style>

</head>

<body>

<h1>魚を描こう！</h1>

<canvas id="canvas" width="400" height="200"></canvas>

<br><br>

色：

<input type="color"
       id="colorPicker"
       value="#000000">

<br>

<button onclick="clearCanvas()">全部消す</button>

<button onclick="saveImage()">PNG保存</button>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const colorPicker =
    document.getElementById("colorPicker");

let drawing = false;

/* マウス押下 */

canvas.addEventListener("mousedown", function(e){

    drawing = true;

    const rect = canvas.getBoundingClientRect();

    ctx.beginPath();

    ctx.moveTo(
        e.clientX - rect.left,
        e.clientY - rect.top
    );

});

/* マウス移動 */

canvas.addEventListener("mousemove", function(e){

    if(!drawing){
        return;
    }

    const rect = canvas.getBoundingClientRect();

    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.strokeStyle =
    colorPicker.value;

    ctx.lineTo(
        e.clientX - rect.left,
        e.clientY - rect.top
    );

    ctx.stroke();

});

/* マウス離す */

canvas.addEventListener("mouseup", function(){

    drawing = false;

});

/* キャンバス外へ */

canvas.addEventListener("mouseleave", function(){

    drawing = false;

});

/* 全部消す */

function clearCanvas(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}

/* PNG保存 */

function saveImage(){

    const link =
        document.createElement("a");

    link.download = "Fish.png";

    link.href =
        canvas.toDataURL("image/png");

    link.click();

}

</script>

</body>
</html>
