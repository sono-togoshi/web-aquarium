<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>描画テスト</title>

<style>

body{
    text-align:center;
    font-family:sans-serif;
}

canvas{
    border:2px solid black;
    background:white;
}

.color{
    width:50px;
    height:50px;
    margin:5px;
    border:2px solid black;
}

</style>

</head>
<body>

<h1>描画テスト</h1>

<div>

<button class="color"
style="background:black"
onclick="setColor('black')"></button>

<button class="color"
style="background:yellow"
onclick="setColor('yellow')"></button>

<button class="color"
style="background:blue"
onclick="setColor('blue')"></button>

<button class="color"
style="background:red"
onclick="setColor('red')"></button>

<button class="color"
style="background:green"
onclick="setColor('green')"></button>

<button class="color"
style="background:purple"
onclick="setColor('purple')"></button>

<br><br>

<button onclick="setSize(2)">
細
</button>

<button onclick="setSize(4)">
中
</button>

<button onclick="setSize(8)">
太
</button>

<button onclick="setEraser()">
消しゴム
</button>

</div>

<br><br>

<canvas id="canvas"
        width="400"
        height="200">
</canvas>

<br><br>

<button onclick="clearCanvas()">
全部消す
</button>

<button onclick="savePNG()">
背景透過PNG保存
</button>


<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let drawing = false;

let currentColor = "black";

let currentSize = 5;


/* 色を選択 */
function setColor(color){

    currentColor = color;

    // 通常の描画モードに戻す
    ctx.globalCompositeOperation = "source-over";

}


/* 線の太さを設定 */
function setSize(size){

    currentSize = size;

}


/* 消しゴム */
function setEraser(){

    // 描いた部分を透明にする
    ctx.globalCompositeOperation = "destination-out";

}


/* マウスを押した */
canvas.addEventListener("mousedown", function(e){

    drawing = true;

    const rect =
    canvas.getBoundingClientRect();

    ctx.beginPath();

    ctx.moveTo(
        e.clientX - rect.left,
        e.clientY - rect.top
    );

});


/* マウスを動かした */
canvas.addEventListener("mousemove", function(e){

    if(!drawing){
        return;
    }

    const rect =
    canvas.getBoundingClientRect();

    ctx.strokeStyle =
    currentColor;

    ctx.lineWidth =
    currentSize;

    ctx.lineCap =
    "round";

    ctx.lineTo(
        e.clientX - rect.left,
        e.clientY - rect.top
    );

    ctx.stroke();

});


/* マウスを離した */
canvas.addEventListener("mouseup", function(){

    drawing = false;

});


/* canvasの外に出た */
canvas.addEventListener("mouseleave", function(){

    drawing = false;

});


/* 全部消す */
function clearCanvas(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


/* PNGとして保存 */
function savePNG(){

    // canvasそのものをPNGに変換
    // サイズは400×200のまま
    // 背景は透明のまま保存される
    const link =
    document.createElement("a");

    link.download =
    "drawing.png";

    link.href =
    canvas.toDataURL("image/png");

    link.click();

}

</script>

</body>
</html>
