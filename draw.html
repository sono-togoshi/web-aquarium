<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魚を描こう</title>

<style>

body{
    background:#eef8ff;
    text-align:center;
    font-family:sans-serif;
}

h1{
    color:#0066aa;
}

canvas{
    border:2px solid #333;
    background:white;
}

button{
    font-size:18px;
    padding:10px 20px;
    margin:5px;
}

.colorButton{
    width:50px;
    height:50px;
    border:2px solid #333;
    cursor:pointer;
}

</style>

</head>

<body>

<h1>魚を描こう！</h1>

<div>

<button class="colorButton"
        style="background:black"
        onclick="setColor('black')">
</button>

<button class="colorButton"
        style="background:red"
        onclick="setColor('red')">
</button>

<button class="colorButton"
        style="background:blue"
        onclick="setColor('blue')">
</button>

<button class="colorButton"
        style="background:green"
        onclick="setColor('green')">
</button>

<button class="colorButton"
        style="background:yellow"
        onclick="setColor('yellow')">
</button>

<button class="colorButton"
        style="background:purple"
        onclick="setColor('purple')">
</button>

<button class="colorButton"
        style="background:orange"
        onclick="setColor('orange')">
</button>

</div>

<br>

<canvas id="canvas"
        width="400"
        height="200"></canvas>

<br><br>

<button onclick="clearCanvas()">
全部消す
</button>

<button onclick="saveImage()">
PNG保存
</button>

<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let drawing = false;

let currentColor = "black";

/* 色変更 */

function setColor(color){

    currentColor = color;

}

/* マウス押下 */

canvas.addEventListener(
    "mousedown",
    function(e){

        drawing = true;

        const rect =
            canvas.getBoundingClientRect();

        ctx.beginPath();

        ctx.moveTo(
            e.clientX - rect.left,
            e.clientY - rect.top
        );

    }
);

/* マウス移動 */

canvas.addEventListener(
    "mousemove",
    function(e){

        if(!drawing){
            return;
        }

        const rect =
            canvas.getBoundingClientRect();

        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.strokeStyle = currentColor;

        ctx.lineTo(
            e.clientX - rect.left,
            e.clientY - rect.top
        );

        ctx.stroke();

    }
);

/* マウス離す */

canvas.addEventListener(
    "mouseup",
    function(){
        drawing = false;
    }
);

/* キャンバス外 */

canvas.addEventListener(
    "mouseleave",
    function(){
        drawing = false;
    }
);

/* 消去 */

function clearCanvas(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}

/* PNG保存 */

function saveImage(){

    const link =
        document.createElement("a");

    link.download = "Fish.png";

    link.href =
        canvas.toDataURL("image/png");

    link.click();

}

</script>

</body>
</html>
