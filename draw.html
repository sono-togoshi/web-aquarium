<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>描画テスト</title>

<style>

body{
    text-align:center;
    font-family:sans-serif;
}

canvas{
    border:2px solid black;
    background:white;
}

.color{
    width:50px;
    height:50px;
    margin:5px;
    border:2px solid black;
}

</style>

</head>
<body>

<h1>描画テスト</h1>

<div>

<button class="color"
style="background:black"
onclick="setColor('black')"></button>

<button class="color"
style="background:yellow"
onclick="setColor('yellow')"></button>

<button class="color"
style="background:blue"
onclick="setColor('blue')"></button>

<button class="color"
style="background:red"
onclick="setColor('red')"></button>

<button class="color"
style="background:green"
onclick="setColor('green')"></button>

<button class="color"
style="background:purple"
onclick="setColor('purple')"></button>

<br><br>

<button onclick="setSize(3)">
細
</button>

<button onclick="setSize(8)">
中
</button>

<button onclick="setSize(14)">
太
</button>

</div>
<br><br>

<canvas id="canvas"
        width="400"
        height="200">
</canvas>

<br><br>

<button onclick="clearCanvas()">
全部消す
</button>


<script>

let drawing = false;
 
let currentColor = "black

let currentSize = 5;

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let drawing = false;

let currentColor = "black";

let currentSize = 5;

function setColor(color){

    currentColor = color;

}

function setSize(size){

    currentSize = size;

}

canvas.addEventListener("mousedown",function(e){

    drawing = true;

    const rect =
    canvas.getBoundingClientRect();

    ctx.beginPath();

    ctx.moveTo(
        e.clientX - rect.left,
        e.clientY - rect.top
    );

});

canvas.addEventListener("mousemove",function(e){

    if(!drawing){
        return;
    }

    const rect =
    canvas.getBoundingClientRect();

    ctx.strokeStyle =
    currentColor;

        ctx.lineCap =
    "round";

    ctx.lineTo(
        e.clientX - rect.left,
        e.clientY - rect.top
    );

    ctx.stroke();

});
});

canvas.addEventListener("mouseup",function(){

    drawing = false;

});

canvas.addEventListener("mouseleave",function(){

    drawing = false;

});

function clearCanvas(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}

</script>

</body>
</html>
