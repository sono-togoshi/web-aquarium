<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魚を描こう</title>

<style>

body{
    font-family:sans-serif;
    text-align:center;
    background:#eef8ff;
    margin:20px;
}

h1{
    color:#0066aa;
}

#canvas{
    border:2px solid #444;
    background:white;
    cursor:crosshair;
    touch-action:none;
}

button{
    font-size:18px;
    padding:10px 20px;
    margin:10px;
}

</style>
</head>

<body>

<h1>魚を描こう！</h1>

<canvas id="canvas" width="400" height="200"></canvas>

<br>

<button onclick="clearCanvas()">全部消す</button>

<button onclick="saveImage()">PNG保存</button>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let drawing = false;

/* ---------- PC ---------- */

canvas.addEventListener("mousedown", function(e){

    drawing = true;

    const rect = canvas.getBoundingClientRect();

    ctx.beginPath();

    ctx.moveTo(
        e.clientX - rect.left,
        e.clientY - rect.top
    );

});

canvas.addEventListener("mousemove", function(e){

    if(!drawing){
        return;
    }

    const rect = canvas.getBoundingClientRect();

    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.strokeStyle = "black";

    ctx.lineTo(
        e.clientX - rect.left,
        e.clientY - rect.top
    );

    ctx.stroke();

});

canvas.addEventListener("mouseup", function(){

    drawing = false;

});

canvas.addEventListener("mouseleave", function(){

    drawing = false;

});

/* ---------- スマホ ---------- */

canvas.addEventListener("touchstart", function(e){

    drawing = true;

    const rect = canvas.getBoundingClientRect();

    const touch = e.touches[0];

    ctx.beginPath();

    ctx.moveTo(
        touch.clientX - rect.left,
        touch.clientY - rect.top
    );

});

canvas.addEventListener("touchmove", function(e){

    if(!drawing){
        return;
    }

    e.preventDefault();

    const rect = canvas.getBoundingClientRect();

    const touch = e.touches[0];

    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.strokeStyle = "black";

    ctx.lineTo(
        touch.clientX - rect.left,
        touch.clientY - rect.top
    );

    ctx.stroke();

});

canvas.
